[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "pyiccprofile"
version = "0.3"
authors = [
  { name="Robert Ancell", email="robert.ancell@gmail.com" },
]
description = "Pure Python ICC profile encoder/decoder"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/robert-ancell/pyiccprofile"
Documentation = "https://robert-ancell.github.io/pyiccprofile/"
Issues = "https://github.com/robert-ancell/pyiccprofile/issues"
